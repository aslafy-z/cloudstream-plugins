name: Build and publish plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build all plugins
        run: ./gradlew --no-daemon testDebugUnitTest make makePluginsJson
      - name: Package release catalog and assets
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('commit-{0}', github.sha) }}
        run: python3 scripts/package_release.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: dist
      - name: Publish compiled plugins as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[1-9][0-9]*$ ]]; then
            echo "Release tags must be v followed by a positive integer (for example v1)." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          CloudStream plugins compiled and tested from the tagged commit.

          Add the repository using repo.json, or install individual .cs3 assets.
          plugins.json contains the version and download URL of each plugin.
          SHA256SUMS contains checksums for the release files.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; publish changes with a new version tag." >&2
            exit 1
          fi
          gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md --latest
