name: Build and publish plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build all plugins
        run: ./gradlew --no-daemon testDebugUnitTest make makePluginsJson
      - name: Package release catalog and assets
        run: python3 scripts/package_release.py --repository "$GITHUB_REPOSITORY" --tag "build-$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: dist
      - name: Publish compiled plugins as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          cat > notes.md <<'NOTES'
          Plugins compiled from the commit linked to this release.
          Install the repository using repo.json, or download individual .cs3 assets.
          M6+ is experimental: playback with an authenticated M6+ account and Android TV Widevine still needs device validation.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "CloudStream plugins · build $GITHUB_RUN_NUMBER" --notes-file notes.md --latest
          fi
